<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Enter Secret Code</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Fullscreen popup style */
    .popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 182, 193, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      z-index: 1000;
    }

    .popup.active {
      opacity: 1;
      pointer-events: auto;
      animation: fadeIn 0.5s ease forwards;
    }

    .popup h1 {
      font-size: 3rem;
      color: white;
      text-shadow: 3px 3px 12px deeppink;
      margin: 0 20px;
      line-height: 1.3;
    }

    .popup button {
      margin-top: 30px;
      padding: 12px 25px;
      font-size: 1.2rem;
      background: deeppink;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s;
    }

    .popup button:hover {
      background: hotpink;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="logo">💞</div>
        <div>
          <h2 style="margin:0">Happy 1st Monthsary</h2>
          <div style="color:#8b5b63;font-weight:600">Enter the code</div>
        </div>
      </div>

      <div class="code-wrap">
        <input id="secret-code" class="code-input" type="password"/>
        <button id="submit-code" class="btn">Enter</button>
        <div id="code-message" class="message"></div>
      </div>
      
      <p class="small" style="margin-top:20px">Tip: it’s our monthsary date 💌</p>
    </div>
  </div>

  <!-- Romantic popup -->
  <div class="popup" id="popup">
    <h1>💞 Happy First Monthsary, Babi 💞</h1>
    <button id="continue-btn">Continue ➜</button>
  </div>

  <script src="app.js"></script>
  <script>
    // Check code input
    const submitBtn = document.getElementById('submit-code');
    const codeInput = document.getElementById('secret-code');
    const popup = document.getElementById('popup');
    const continueBtn = document.getElementById('continue-btn');
    const message = document.getElementById('code-message');

    function checkCode() {
      const code = codeInput.value.trim();
      if (code === '091825') {
        popup.classList.add('active');
      } else {
        message.textContent = 'Wrong code, try again 😢';
        message.style.color = 'red';
      }
    }

    // Button click
    submitBtn.addEventListener('click', checkCode);

    // Press Enter
    codeInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        checkCode();
      }
    });

    // Continue button
    continueBtn.addEventListener('click', () => {
      window.location.href = 'main.html';
    });


  </script>
</body>
</html>
