<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Videos</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="logo">🎬</div>
        <div>
          <h2 style="margin:0">Videos</h2>
          <div style="color:#8b5b63;font-weight:600">Your recorded moments with your guitar</div>
        </div>
      </div>

      <div class="grid">
        <div class="video-card tilt">
          <video controls style="width:100%; height:100%; object-fit:cover;">
            <source src="Cutie1.mp4" type="video/mp4">
            Your browser does not support video.
          </video>
        </div>

        <div class="video-card tilt">
          <video controls style="width:100%; height:100%; object-fit:cover;">
            <source src="Cutie2.mp4" type="video/mp4">
          </video>
        </div>
      </div>
      <br>
        <div class="video-card tilt">
          <video controls style="width:50%; height:100%; object-fit:cover;">
            <source src="Cutie3.mp4" type="video/mp4">
            Your browser does not support video.
          </video>
        </div>

      <p class="small" style="margin-top:12px"></p>

      <a class="btn" href="main.html" style="margin-top:14px; display:inline-block">Back to Menu</a>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
